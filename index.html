<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Choir of One</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: one full-bleed stained-glass canvas; leaded panes of interface float over it; each screen is a column stacked on top. */
:root {
  color-scheme: dark;
  --ink: #0b0a14;            /* the lead between the glass, and the ground of the page */
  --night: #15132b;          /* deep glass */
  --pane: rgba(17, 15, 36, 0.86);
  --pane-solid: #14122a;
  --pill: rgba(241, 233, 210, 0.12);
  --line: rgba(242, 193, 78, 0.34);
  --shadow: rgba(4, 3, 10, 0.55);
  --gold: #f2c14e;
  --gold-deep: #b9862b;
  --azure: #58a6e6;
  --rose: #e2577c;
  --emerald: #46b98c;
  --text: #f1e9d2;
  --dim: #aaa4be;
  --good: #7fe0a0;
  --warn: #f2b84e;
  --bad: #ef6a6a;
  --f-display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --f-story: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --f-ui: 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', system-ui, sans-serif;
  --fs-xs: 0.75rem; --fs-s: 0.875rem; --fs-m: 1rem; --fs-l: 1.25rem; --fs-xl: 1.7rem;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--f-ui); font-size: 16px; line-height: 1.35; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
#app { position: relative; height: 100%; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }
.gut { padding-left: var(--gut-l); padding-right: var(--gut-r); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }

.pane { background: var(--pane); border: 2px solid var(--ink); border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line), 0 8px 22px var(--shadow); }
.btn { font-family: var(--f-display); font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; font-size: var(--fs-s); padding: 0.8em 1.5em; border: 2px solid var(--ink); border-radius: 8px; background: linear-gradient(180deg, var(--gold), var(--gold-deep)); color: var(--ink); box-shadow: 0 4px 14px var(--shadow); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--pane); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.btn.small { font-size: var(--fs-xs); padding: 0.55em 0.9em; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.ibtn { width: 2.25rem; height: 2.25rem; flex: none; border: 2px solid var(--ink); border-radius: 8px; background: var(--pane); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); font-weight: 800; font-size: var(--fs-m); display: grid; place-items: center; padding: 0; }
.label { font-size: var(--fs-xs); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- title ---------- */
#s-title { align-items: center; justify-content: flex-end; text-align: center; padding-block: 1.5rem; gap: 0.9rem; }
#s-title h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(2.1rem, 8vw, 4.4rem); letter-spacing: 0.12em; line-height: 1; color: var(--text); text-shadow: 0 2px 0 var(--ink), 0 0 34px var(--line); }
#s-title .tag { font-family: var(--f-story); font-style: italic; font-size: clamp(1.05rem, 2.6vw, 1.4rem); color: var(--dim); max-width: 34ch; text-wrap: balance; }
.row { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; align-items: center; }
.fine { font-size: var(--fs-xs); color: var(--dim); max-width: 46ch; }

/* ---------- panels that hold text: setup, story, results, modal ---------- */
.sheet-wrap { flex: 1; min-height: 0; display: grid; place-items: center; padding-block: 1rem; overflow: auto; }
.sheet { width: min(100%, 44rem); max-height: 100%; overflow: auto; padding: 1.25rem 1.4rem; display: flex; flex-direction: column; gap: 1rem; }
.sheet h2 { font-family: var(--f-display); font-weight: 700; letter-spacing: 0.08em; font-size: var(--fs-xl); }
.sheet h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: 0.08em; font-size: var(--fs-m); color: var(--gold); }
.field { display: flex; flex-direction: column; gap: 0.45rem; min-width: 0; }
.field p { color: var(--dim); font-size: var(--fs-s); }
.opts { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.opt { border: 2px solid var(--ink); border-radius: 8px; background: var(--pill); padding: 0.5em 0.85em; font-weight: 700; font-size: var(--fs-s); box-shadow: inset 0 0 0 1px var(--line); text-align: left; }
.opt[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
.opt small { display: block; font-weight: 500; opacity: 0.8; }
select, input[type="number"] { background: var(--pane-solid); border: 2px solid var(--ink); border-radius: 8px; padding: 0.5em 0.6em; box-shadow: inset 0 0 0 1px var(--line); max-width: 100%; }
input[type="range"] { accent-color: var(--gold); min-width: 0; }
.status { font-size: var(--fs-s); color: var(--dim); min-height: 1.3em; }
.status.ok { color: var(--good); } .status.bad { color: var(--warn); }
.tuner { display: flex; align-items: baseline; gap: 0.6rem; font-variant-numeric: tabular-nums; }
.tuner b { font-size: var(--fs-xl); font-family: var(--f-display); min-width: 3.2ch; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem 1.4rem; }

#s-story .sheet { width: min(100%, 40rem); gap: 0.8rem; }
#st-who { font-family: var(--f-display); letter-spacing: 0.14em; font-size: var(--fs-s); color: var(--gold); min-height: 1.2em; }
#st-text { font-family: var(--f-story); font-size: clamp(1.25rem, 3.4vw, 1.65rem); line-height: 1.32; min-height: 5.5em; }
#st-text.narr { font-style: italic; }

/* ---------- map ---------- */
#s-map .map-top { display: flex; align-items: center; gap: 0.6rem; padding-block: 0.5rem; }
#s-map .map-top h2 { font-family: var(--f-display); font-size: var(--fs-m); letter-spacing: 0.14em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#map-area { flex: 1; min-height: 0; position: relative; }
#map-nodes button { position: absolute; border-radius: 50%; border: 0; background: transparent; padding: 0; transform: translate(-50%, -50%); }
#card { position: absolute; display: flex; flex-direction: column; gap: 0.5rem; padding: 0.9rem 1rem; overflow: auto; }
#card h3 { font-family: var(--f-display); font-size: var(--fs-l); letter-spacing: 0.06em; line-height: 1.1; }
#card .mode { font-family: var(--f-display); color: var(--gold); letter-spacing: 0.06em; }
#card .formula { font-weight: 800; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
#card .blurb { font-family: var(--f-story); font-style: italic; font-size: 1.12rem; line-height: 1.25; color: var(--text); }
#card .meta { display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.7rem; font-size: var(--fs-s); }
#card .meta dt { color: var(--dim); } #card .meta dd { margin: 0; font-weight: 700; }
.keydots { display: flex; gap: 3px; flex-wrap: wrap; }
.keydots i { width: 1.35rem; height: 1.35rem; border-radius: 4px; border: 1.5px solid var(--ink); display: grid; place-items: center; font-style: normal; font-size: 0.62rem; font-weight: 800; color: var(--ink); opacity: 0.28; }
.keydots i.on { opacity: 1; }

/* ---------- battle ---------- */
.hud-top { display: flex; align-items: center; gap: 0.6rem; padding-block: 0.4rem; background: linear-gradient(180deg, var(--pane-solid), transparent); flex-wrap: wrap; }
.lvl { flex: 1 1 9rem; min-width: 0; }
.lvl-name { font-family: var(--f-display); font-weight: 700; letter-spacing: 0.08em; font-size: var(--fs-m); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lvl-key { font-size: var(--fs-s); color: var(--dim); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lvl-key b { color: var(--gold); }
.pips { display: flex; gap: 4px; }
.pips i { width: 0.7rem; height: 0.7rem; transform: rotate(45deg); border: 1.5px solid var(--ink); background: var(--pill); }
.pips i.on { background: var(--gold); } .pips i.cur { box-shadow: 0 0 0 2px var(--text); }
.tempo { display: flex; align-items: center; gap: 0.35rem; }
.tempo input[type="range"] { width: clamp(4.5rem, 16vw, 11rem); }
.bpm { display: flex; flex-direction: column; align-items: center; line-height: 1; min-width: 2.6rem; }
.bpm b { font-size: var(--fs-l); font-variant-numeric: tabular-nums; } .bpm span { font-size: 0.6rem; letter-spacing: 0.14em; color: var(--dim); }
.bonus { font-size: var(--fs-xs); font-weight: 800; color: var(--good); min-width: 3ch; font-variant-numeric: tabular-nums; }
.chk { display: flex; align-items: center; gap: 0.25rem; font-size: var(--fs-xs); font-weight: 700; color: var(--dim); }
.chk input { accent-color: var(--gold); width: 1rem; height: 1rem; }

.ribbon-wrap { display: flex; justify-content: center; padding-block: 0.1rem 0.3rem; pointer-events: none; }
.ribbon { pointer-events: auto; display: flex; align-items: center; gap: 0.6rem; padding: 0.35rem 0.7rem; max-width: 100%; min-width: 0; }
.bless { display: flex; align-items: center; gap: 0.3rem; color: var(--dim); }
.bless svg { width: 1.15rem; height: 1.15rem; fill: currentColor; flex: none; }
.bless .bl-name { font-size: var(--fs-xs); font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
.bless .bl-pips { display: flex; gap: 2px; }
.bless .bl-pips i { width: 0.5rem; height: 0.8rem; border-radius: 2px; background: var(--pill); border: 1.5px solid var(--ink); }
.bless.edge.on { color: var(--rose); } .bless.heart.on { color: var(--emerald); } .bless.mail.on { color: var(--gold); }
.bless .bl-pips i.on { background: currentColor; }
.bless.pop { animation: pop 0.45s; }
@keyframes pop { 30% { transform: scale(1.25); } }
.pills { display: flex; gap: 3px; flex-wrap: wrap; min-width: 0; }
.pill { min-width: 1.45rem; height: 1.5rem; padding: 0 0.3rem; border-radius: 5px; background: var(--pill); font-weight: 800; font-size: var(--fs-s); display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.pill.done { background: var(--gold); color: var(--ink); }
.pill.next { box-shadow: 0 0 0 2px var(--text); }
.rb-meta { display: flex; flex-direction: column; align-items: flex-end; font-size: var(--fs-xs); font-weight: 800; line-height: 1.15; white-space: nowrap; color: var(--dim); }
.rb-meta .streak { color: var(--good); }
.meter { height: 0.5rem; border-radius: 4px; background: var(--pill); overflow: hidden; border: 1.5px solid var(--ink); }
.meter i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); }
.anthem { display: flex; flex-direction: column; gap: 2px; min-width: 4.5rem; }
.anthem .meter i { background: linear-gradient(90deg, var(--azure), var(--text)); }
.shake { animation: shake 0.25s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

#stage { flex: 1; min-height: 0; position: relative; touch-action: none; }
/* Tine sits beside the ladder, never over it: the ladder is how you play by touch. --clear is set from the ladder's width. */
.tine-wrap { position: absolute; left: var(--clear, 8rem); right: 0.5rem; bottom: 0.4rem; display: flex; justify-content: center; pointer-events: none; }
.tine { width: min(100%, 34rem); padding: 0.55rem 0.8rem; display: flex; gap: 0.6rem; align-items: flex-start; font-size: var(--fs-s); }
.tine b { font-family: var(--f-display); color: var(--gold); letter-spacing: 0.1em; flex: none; }
.tine span { font-family: var(--f-story); font-size: 1.12rem; line-height: 1.22; }
.duel { position: absolute; inset: 0; margin: auto; height: fit-content; width: min(94%, 36rem); padding: 0.9rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 0.6rem; text-align: center; }
.duel h3 { font-family: var(--f-display); letter-spacing: 0.1em; font-size: var(--fs-l); }
.duel .pills { justify-content: center; } .duel .pill { min-width: 1.9rem; height: 2rem; font-size: var(--fs-m); }
.duel p { color: var(--dim); font-size: var(--fs-s); }

.hud-bot { display: grid; grid-template-columns: minmax(7rem, auto) 1fr minmax(8rem, auto); gap: 0.5rem; padding-block: 0.4rem 0.5rem; align-items: stretch; background: linear-gradient(0deg, var(--pane-solid), transparent); }
.res { padding: 0.4rem 0.7rem; display: flex; flex-direction: column; justify-content: center; gap: 0.1rem; }
.res .mana { font-size: var(--fs-xl); font-weight: 800; line-height: 1; color: var(--azure); font-variant-numeric: tabular-nums; }
.res .flow { font-size: var(--fs-s); font-weight: 700; color: var(--dim); font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0.4rem; min-width: 0; }
.card { padding: 0.35rem 0.5rem; display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; text-align: left; }
.card .c-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.3rem; }
.card .c-name { font-weight: 800; font-size: var(--fs-s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .c-cost { font-weight: 800; font-size: var(--fs-s); color: var(--azure); font-variant-numeric: tabular-nums; }
.card.poor .c-cost { color: var(--bad); } .card.poor { opacity: 0.72; }
.card.armed { box-shadow: inset 0 0 0 2px var(--gold), 0 0 18px var(--line); }
.card.listen { box-shadow: inset 0 0 0 2px var(--rose); }
.card.off { visibility: hidden; } /* keeps its place, so the stage does not change size every time somebody sings */
.card .c-sub { font-size: var(--fs-xs); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .pill { min-width: 1.25rem; height: 1.35rem; font-size: var(--fs-xs); padding: 0 0.2rem; }
.harm { padding: 0.4rem 0.7rem; display: flex; flex-direction: column; justify-content: center; gap: 0.15rem; font-size: var(--fs-xs); min-height: 4.5rem; max-width: 15rem; }
.harm b { font-size: var(--fs-s); } .harm .clash { color: var(--good); } .harm .feed { color: var(--bad); }
.rehearse-bar { position: absolute; right: var(--gut-r); bottom: 0.5rem; display: flex; gap: 0.4rem; }

/* ---------- results ---------- */
#s-results { background: rgba(6, 5, 12, 0.62); }
.stars { display: flex; gap: 0.5rem; justify-content: center; }
.stars i { width: 1.6rem; height: 1.6rem; transform: rotate(45deg); border: 2px solid var(--ink); background: var(--pill); }
.stars i.on { background: var(--gold); box-shadow: 0 0 18px var(--line); }
.bigflow { font-family: var(--f-display); font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 900; text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: 0.5rem; }
.stat { background: var(--pill); border-radius: 8px; padding: 0.45rem 0.6rem; min-width: 0; }
.stat b { display: block; font-size: var(--fs-l); font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--fs-xs); color: var(--dim); }
.unlock { border-radius: 8px; padding: 0.6rem 0.8rem; background: var(--pill); box-shadow: inset 0 0 0 1px var(--line); }
.unlock b { font-family: var(--f-display); color: var(--gold); letter-spacing: 0.06em; }

/* ---------- modal ---------- */
#modal { position: absolute; inset: 0; background: rgba(6, 5, 12, 0.72); display: flex; z-index: 20; }
#modal .sheet { gap: 0.9rem; }
.mrow { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
.help { display: grid; grid-template-columns: minmax(6.5rem, auto) 1fr; gap: 0.45rem 0.9rem; font-size: var(--fs-s); }
.help dt { font-weight: 800; color: var(--gold); } .help dd { margin: 0; color: var(--text); }
#toast { position: absolute; left: 50%; bottom: 5.5rem; transform: translateX(-50%); padding: 0.5rem 0.9rem; font-size: var(--fs-s); font-weight: 700; z-index: 30; max-width: 90%; text-align: center; pointer-events: none; }

@media (max-width: 720px) {
  .hud-bot { grid-template-columns: 1fr 1fr; }
  .cards { grid-column: 1 / -1; order: 3; }
  .card.listen { display: none; } /* on a narrow screen the bubble over the singer says it all */
  .harm { max-width: none; min-height: 5.2rem; }
  .tempo input[type="range"] { width: clamp(4rem, 26vw, 9rem); }
  .ribbon { flex-wrap: wrap; justify-content: center; gap: 0.3rem 0.6rem; }
  .bless .bl-name { display: none; }
  .res .mana { font-size: var(--fs-l); }
}
@media (max-height: 520px) {
  .hud-top { padding-block: 0.2rem; } .hud-bot { padding-block: 0.2rem 0.3rem; }
  .card .c-sub { display: none; }
  #s-title { justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { .shake, .bless.pop { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-hidden="true"></canvas>

  <section id="s-title" class="screen gut">
    <h1>Choir of One</h1>
    <p class="tag">The Tuning Fork of Truth has cracked. You know one tune. Sing the world back in.</p>
    <div class="row">
      <button id="b-begin" class="btn">Begin</button>
      <button id="b-how" class="btn ghost">How it plays</button>
      <button id="b-set0" class="btn ghost">Settings</button>
    </div>
    <p class="fine">Played with your voice, a horn or a keyboard. Headphones help. The game listens and never records.</p>
  </section>

  <section id="s-setup" class="screen gut" hidden>
    <div class="sheet-wrap"><div class="sheet pane" id="setup-sheet"></div></div>
  </section>

  <section id="s-story" class="screen gut" hidden>
    <div class="sheet-wrap"><div class="sheet pane">
      <div id="st-who"></div>
      <p id="st-text"></p>
      <div class="mrow"><button id="b-skip" class="btn ghost small">Skip</button><button id="b-next" class="btn">Go on</button></div>
    </div></div>
  </section>

  <section id="s-map" class="screen" hidden>
    <div class="map-top gut">
      <h2>The Great Window</h2>
      <button id="b-journal" class="btn ghost small">Journal</button>
      <button id="b-set1" class="btn ghost small">Settings</button>
    </div>
    <div id="map-area">
      <div id="map-nodes"></div>
      <div id="card" class="pane"></div>
    </div>
  </section>

  <section id="s-battle" class="screen" hidden>
    <header class="hud-top gut">
      <button id="b-pause" class="ibtn" aria-label="Pause">II</button>
      <div class="lvl"><div id="h-name" class="lvl-name"></div><div id="h-key" class="lvl-key"></div></div>
      <div id="h-verse" class="pips" aria-label="Wards"></div>
      <div class="tempo">
        <button id="b-slower" class="ibtn" aria-label="Slower">−</button>
        <input id="i-bpm" type="range" min="50" max="200" step="1" aria-label="Tempo">
        <button id="b-faster" class="ibtn" aria-label="Faster">+</button>
        <div class="bpm"><b id="h-bpm">96</b><span>BPM</span></div>
        <div id="h-bonus" class="bonus"></div>
        <label class="chk" title="Pushes the tempo up while you play cleanly"><input id="i-accel" type="checkbox"><span>Auto</span></label>
      </div>
    </header>
    <div class="ribbon-wrap gut">
      <div id="ribbon" class="pane ribbon">
        <div class="bless edge" id="bl-edge" title="Edge: damage. Earned by playing leaps."><svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-8.5 3 2.5 0 5-3 2.5Z"/><path d="M-4.6 3H4.6M0 5V8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="bl-name">Edge</span><span class="bl-pips"><i></i><i></i><i></i></span></div>
        <div class="bless heart" id="bl-heart" title="Heart: health. Earned by playing steps."><svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0 6.8C-9.5 0-5-8 0-2.6 5-8 9.5 0 0 6.8Z"/></svg><span class="bl-name">Heart</span><span class="bl-pips"><i></i><i></i><i></i></span></div>
        <div class="bless mail" id="bl-mail" title="Mail: armor. Earned by playing chords."><svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M-6-6.5H6V0Q5 5.5 0 8-5 5.5-6 0Z"/></svg><span class="bl-name">Mail</span><span class="bl-pips"><i></i><i></i><i></i></span></div>
        <div class="rb-meta"><span id="rb-speed"></span><span id="rb-streak" class="streak"></span></div>

// Pick a cell. o.method limits it to one way of playing; o.cover (per family) and o.seen (per pattern, and per
// pattern on a given degree) are counts of what has already been played, and the pick leans away from them.
function genEtude(r, grade, top, mode, bannedPcs, o) {
  o = o || {};
  let g = grade, c = [];
  if (g > 1 && r() < 0.25) g--; // one in four comes from the grade below
  while (g >= 1 && !(c = etudeCandidates(g, top, mode, bannedPcs, o.method)).length) g--;
  if (!c.length) for (g = grade + 1; g <= 3 && !(c = etudeCandidates(g, top, mode, bannedPcs, o.method)).length; g++);
  if (!c.length) return null;
  if (o.minLen) { const long = c.filter((e) => e.notes.length >= o.minLen); if (long.length) c = long; }
  const cover = o.cover || {}, seen = o.seen || {}, perFam = {};
  for (const e of c) perFam[e.fam] = (perFam[e.fam] || 0) + 1;
  let tot = 0;
  const w = c.map((e) => {
    const x = (e.id === o.lastId ? 0.15 : 1) / (perFam[e.fam] * (1 + (cover[e.fam] || 0)) * (1 + 2 * (seen[e.id] || 0)) * (1 + 3 * (seen[e.id + '@' + e.k] || 0)));
    tot += x; return x;
  });
  let pick = r() * tot, i = 0;
  while (i < c.length - 1 && (pick -= w[i]) > 0) i++;
  const e = c[i];
  return { id: e.id, fam: e.fam, grade: e.grade, name: e.name, notes: e.notes, k: e.k, hidden: false };
}
// an echo: a short lick the player hears but does not see
function genEcho(r, grade, top, mode, bannedPcs) {
  const len = grade + 1, hiD = Math.min(top, 10), leap = grade === 1 ? 7 : grade === 2 ? 4 : 6;
  for (let tries = 0; tries < 40; tries++) {
    const starts = grade === 1 ? [1] : [1, 5, 3, 8].filter((d) => d <= hiD);
    const notes = [pickR(r, starts)];
    while (notes.length < len) {
      const prev = notes[notes.length - 1];
      let d = prev + (Math.floor(r() * leap) + 1) * (r() < 0.5 ? -1 : 1);
      if (d < 1 || d > hiD) d = prev + (prev > hiD / 2 ? -1 : 1) * (Math.floor(r() * leap) + 1);
      d = clamp(d, 1, hiD);
      if (degPc(mode, d) === degPc(mode, prev)) continue;
      notes.push(d);
    }
    const pcs = toPcs(mode, notes);
    if (bannedPcs.some((b) => containsSeq(pcs, b) || isSuffix(pcs, b))) continue;
    return { id: 'echo', fam: 'echo', grade, name: 'Echo', notes, k: notes[0], hidden: true };
  }
  return null;
}

function levelNumbers(lv, vl) {

function makePitchDetector(sampleRate, size) {

    if (kind === 'pad') {
      filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 900; filt.Q.value = 0.5;
      for (const d of [-8, 0, 7]) { const o = c.createOscillator(); o.setPeriodicWave(this.wPad); o.detune.value = d; o.connect(filt); o.start(t); oscs.push(o); }
      const g = c.createGain(); g.gain.value = 0.33; filt.connect(g); g.connect(out);
    } else if (kind === 'fork') {
      for (const d of VOICES.fork.det) { const o = c.createOscillator(); o.detune.value = d; const g = c.createGain(); g.gain.value = 0.5; o.connect(g); g.connect(out); o.start(t); oscs.push(o); }
    } else {
      const V = VOICES[kind], mix = c.createGain(); mix.gain.value = 1 / V.det.length;
      const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = V.vibHz * 0.9; lg.gain.value = V.vib * 0.6; lfo.connect(lg); lfo.start(t);
      for (const d of V.det) { const o = c.createOscillator(); o.setPeriodicWave(this.wGlottal); o.detune.value = d; lg.connect(o.detune); o.connect(mix); o.start(t); oscs.push(o); }
      const v = VOWELS[V.vowel];
      for (let i = 0; i < 3; i++) { const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = v[i][1]; bp.frequency.value = v[i][0] * V.fs; const g = c.createGain(); g.gain.value = v[i][2] * 1.6; mix.connect(bp); bp.connect(g); g.connect(out); }
      const ch = c.createBiquadFilter(); ch.type = 'lowpass'; ch.frequency.value = 420; const cg = c.createGain(); cg.gain.value = V.chest; mix.connect(ch); ch.connect(cg); cg.connect(out);
    }
    this._out(out, bus || 'music', 0, 0);
    return {
      midi: null,
      set(midi, glide) {
        const f = midiToFreq(midi), tt = c.currentTime;
        for (const o of oscs) { if (glide && this.midi != null) o.frequency.setTargetAtTime(f, tt, glide); else o.frequency.setValueAtTime(f, tt); }
        this.midi = midi;
      },
      gain(g, tc) { out.gain.setTargetAtTime(g, c.currentTime, tc || 0.05); },
    };
  },
};

// ===== music: one tune, written in scale degrees, re-moded for wherever you are =====
// [step in 16ths, degree, length in 16ths]. Degree 0 is the seventh below home.
const THEME = [
  [0, 1, 4], [4, 5, 4], [8, 4, 2], [10, 3, 2], [12, 2, 4],
  [16, 3, 4], [20, 1, 4], [24, 2, 8],
  [32, 1, 4], [36, 5, 4], [40, 6, 2], [42, 5, 2], [44, 4, 4],
  [48, 3, 6], [54, 2, 2], [56, 1, 8],
  [64, 5, 4], [68, 8, 4], [72, 7, 2], [74, 6, 2], [76, 5, 4],
  [80, 6, 4], [84, 4, 4], [88, 5, 8],
  [96, 3, 4], [100, 5, 4], [104, 4, 2], [106, 3, 2], [108, 2, 4],
  [112, 0, 4], [116, 2, 4], [120, 1, 8],
];
const THEME_AT = {};
THEME.forEach((n) => (THEME_AT[n[0]] = n));
const dOff = (mode, d) => mode.steps[mod(d - 1, mode.steps.length)] + 12 * Math.floor((d - 1) / mode.steps.length);

// percussion per nation: 16 steps a bar, value = velocity
const PERC = {
  wild: { boom: { 0: 0.9, 6: 0.55, 8: 0.8, 11: 0.4 }, tap: { 4: 0.6, 12: 0.65, 14: 0.35 }, shake: { 0: 0.3, 2: 0.5, 4: 0.3, 6: 0.5, 8: 0.3, 10: 0.5, 12: 0.3, 14: 0.55 } },
  risen: { boom: { 0: 0.85, 8: 0.5 }, bone: { 3: 0.5, 7: 0.6, 10: 0.45, 11: 0.5, 15: 0.6 }, heart: { 12: 0.35, 13: 0.25 } },
  spore: { boom: { 0: 0.7, 10: 0.5 }, tick: { 2: 0.6, 6: 0.65, 10: 0.5, 14: 0.7 }, shake: { 1: 0.2, 3: 0.3, 5: 0.2, 7: 0.3, 9: 0.2, 11: 0.3, 13: 0.2, 15: 0.3 } },
  choir: { tap: { 4: 0.3, 12: 0.3 }, boom: { 0: 0.5 }, shake: { 2: 0.25, 6: 0.25, 10: 0.25, 14: 0.25 } },
  fork: { heart: { 0: 0.6, 3: 0.4 } },
};
const CHORD = [0, 2, 4, 7]; // stacked thirds, as degree offsets from the chord root
const HARP8 = [0, 2, 3, 2, 1, 2, 3, 2];
const KAL16 = [0, -1, 2, -1, 1, -1, 2, 3, -1, 2, -1, 1, 2, -1, 0, -1];

const Music = {
  scene: { kind: 'silence', nation: 'choir', mode: MODES.lydian, tonicPc: 5, bpm: 70, intensity: 0.5, ladTonic: 53, eDrone: 0, ref: false },
  pos: 0, next: 0, sus: null, enabled: true,

  ensure() {
    if (!AU.on || this.sus) return;
    this.sus = { bed1: AU.makeSus('pad'), bed5: AU.makeSus('pad'), ref: AU.makeSus('pad'), mon: AU.makeSus('choir', 'mon'), enemy: {}, enemyKind: null };
  },
  set(sc, restart) {
    const prev = this.scene;
    this.scene = Object.assign({}, prev, sc);
    if (restart) { this.pos = 0; this.next = 0; }
    this.ensure();
    this.applySus();
  },
  tonic(base) { // the tonic nearest to a register
    return base + mod(this.scene.tonicPc - base, 12);
  },
  note(deg, base) { return this.tonic(base) + dOff(this.scene.mode, deg); },
  applySus() {
    if (!this.sus) return;
    const sc = this.scene, S = this.sus, quiet = sc.kind === 'silence';
    const bed = this.tonic(43);
    S.bed1.set(bed, 0.25); S.bed5.set(bed + dOff(sc.mode, 5), 0.25);
    const g = quiet ? 0 : sc.kind === 'duel' ? 0.16 : sc.kind === 'battle' ? 0.13 : 0.17;
    S.bed1.gain(g, 0.4); S.bed5.gain(g * 0.6, 0.4);
    S.ref.set(sc.ladTonic < 48 ? sc.ladTonic + 12 : sc.ladTonic, 0.05);
    S.ref.gain(sc.ref && (sc.kind === 'battle' || sc.kind === 'duel') ? 0.1 : 0, 0.3);
    // their stronghold's drone, in their own voice
    const kind = sc.nation === 'choir' ? 'wild' : sc.nation;
    for (const k in S.enemy) if (k !== kind) S.enemy[k].gain(0, 0.3);
    if (sc.kind === 'battle' && sc.eDrone && VOICES[kind] && !VOICES[kind].pure) {
      if (!S.enemy[kind]) S.enemy[kind] = AU.makeSus(kind, 'voice');
      S.enemy[kind].set(this.tonic(45) + dOff(sc.mode, sc.eDrone), 0.2);
      S.enemy[kind].gain(0.085, 0.5);
    } else if (S.enemy[kind]) S.enemy[kind].gain(0, 0.3);
  },
  // the note you are playing by hand (touch, keys, MIDI) is sung for you
  monitor(midi) {
    if (!this.sus) return;
    if (midi == null) this.sus.mon.gain(0, 0.05);
    else { this.sus.mon.set(midi, 0.012); this.sus.mon.gain(0.5, 0.02); }
  },

  // advance the transport and schedule whatever falls inside the lookahead
  advance(dtBeats) {
    if (!AU.on || AU.ctx.state !== 'running') { this.pos += dtBeats; this.next = Math.ceil(this.pos * 4); return; }
    this.pos += dtBeats;
    const sc = this.scene, spb = 60 / sc.bpm, look = 0.14 / spb, now = AU.ctx.currentTime;
    if (this.next < this.pos * 4 - 2) this.next = Math.ceil(this.pos * 4); // fell behind (tab was hidden): skip, do not machine-gun
    while (this.next / 4 <= this.pos + look) {
      const t = Math.max(now + 0.005, now + (this.next / 4 - this.pos) * spb);
      if (this.enabled) this.step(this.next, t);
      this.next++;
    }
  },
  step(st, t) {
    const sc = this.scene, K = sc.kind;
    if (K === 'silence') return;
    const s = st % 16, bar = Math.floor(st / 16), s16 = 15 / sc.bpm, mode = sc.mode, nat = sc.nation;
    const battle = K === 'battle', calm = K === 'title' || K === 'map' || K === 'story' || K === 'results';
    const I = battle ? sc.intensity : 0.35;
    if (mode.steps.length !== 7) { // the Fork: a heartbeat and one bell a bar
      if (s === 0) AU.gong(this.tonic(48), t, 0.12);
      const h = PERC.fork.heart[s]; if (h) AU.drum('heart', t, h * 0.5);
      return;
    }
    const R0 = mode.prog[Math.floor(bar / 2) % mode.prog.length], R = R0 > 4 ? R0 - 7 : R0;
    const hb = 48; // harp register
    if (K === 'duel') { const h = PERC.fork.heart[s]; if (h) AU.drum('heart', t, h * 0.6); return; }
    // bass
    if (s === 0) AU.pluck(this.note(R, 36), t, 0.45, { bright: 0.2, send: 0.1 });
    else if (battle && s === 10) AU.pluck(this.note(R + 4, 36), t, 0.35, { bright: 0.2, send: 0.1 });
    // the broken chord that carries the mode
    if (nat === 'spore') {
      const k = KAL16[s];
      if (k >= 0 && (battle || s % 2 === 0)) AU.kalimba(this.note(R + CHORD[k], hb + 12), t, 0.3 + 0.12 * (s % 4 === 0), { pan: s % 4 < 2 ? -0.25 : 0.25 });
    } else if (nat === 'risen') {
      if (s % 4 === 0) AU.glock(this.note(R + CHORD[(s / 4 + bar) % 4], hb + 12), t, 0.26, { pan: -0.2, dec: 1.6 });
      if (s % 8 === 6) AU.glock(this.note(R + CHORD[2], hb + 24), t, 0.12, { pan: 0.3, dec: 1.2 });
    } else if (s % 2 === 0 && (battle || calm)) {
      const k = HARP8[s / 2], v = 0.34 + (s === 0 ? 0.12 : 0);
      AU.pluck(this.note(R + CHORD[k], hb), t, v * (calm ? 0.9 : 1), { bright: nat === 'wild' ? 0.7 : 0.45, pan: -0.15 + 0.1 * k, send: 0.2 });
    }
    if (nat === 'choir' && s === 0 && bar % 2 === 0) { // organ swell under the home music
      for (const k of [0, 1, 2]) AU.organ(this.note(R + CHORD[k], 48), t, s16 * 30, 0.2, { pan: (k - 1) * 0.3 });
    }
    if (nat === 'risen' && s === 0 && bar % 4 === 0) AU.gong(this.tonic(36), t, 0.16);
    // the tune: four bars on, four bars off, so there is room to hear them sing
    const cyc = st % 256, tb = cyc < 64 ? cyc : cyc >= 128 && cyc < 192 ? cyc - 64 : -1;
    const n = tb >= 0 ? THEME_AT[tb] : null;
    if (n && K !== 'story') {
      const midi = this.note(n[1], 60), dur = n[2] * s16 * 0.94, v = battle ? 0.5 : 0.62;
      if (nat === 'wild' || nat === 'choir') AU.flute(midi + (nat === 'wild' ? 12 : 0), t, dur, v * 0.8, { pan: 0.1 });
      else if (nat === 'risen') { AU.voice(midi, t, dur, v * 0.42, { kind: 'risen', bus: 'music', pan: 0.1, send: 0.3 }); AU.glock(midi + 12, t, v * 0.25, { dec: 1.4 }); }
      else if (nat === 'spore') { AU.glock(midi + 12, t, v * 0.5, { dec: 0.7 }); if (n[2] >= 4) AU.kalimba(midi, t + s16 * 2, v * 0.4); }
      else AU.flute(midi, t, dur, v * 0.7, {});
    }
    // percussion
    const P = PERC[nat];
    if (P && (battle || (K === 'map' && nat !== 'choir'))) {
      const vol = battle ? 0.55 + 0.45 * I : 0.3;
      for (const name in P) {
        const v = P[name][s];
        if (!v) continue;
        if (!battle && name !== 'boom' && name !== 'heart') continue;
        if (name === 'shake' && I < 0.3) continue;
        AU.drum(name, t, v * vol, { pan: name === 'boom' || name === 'heart' ? 0 : name === 'tap' ? 0.2 : -0.25, pitch: name === 'bone' ? 0.8 + Math.random() * 0.5 : 1, send: name === 'boom' ? 0.12 : 0.05 });
      }
      if (battle && I > 0.75 && s % 4 === 3) AU.drum('tap', t, 0.25 * vol, { pan: 0.3, pitch: 1.3 });
    }
  },

  // ---- sounds that belong to the game but are made of the current scale ----
  ladNote(d) { const sc = this.scene; return sc.ladTonic + dOff(sc.mode, d); },
  callBase() { const b = this.scene.ladTonic; return b < 48 ? b + 12 : b > 62 ? b - 12 : b; },
  spb() { return 60 / this.scene.bpm; },
  // one of theirs sings its motif
  call(motif, kind, pan) {
    if (!AU.on) return;
    const t0 = AU.ctx.currentTime + 0.03, half = this.spb() / 2, base = this.callBase(), mode = this.scene.mode;
    AU.duckMusic(t0, motif.length * half + 0.2, 0.45);
    motif.forEach((d, j) => {
      const m = base + dOff(mode, d), t = t0 + j * half;
      AU.voice(m, t, half * 0.92, 0.95, { kind, pan: pan == null ? 0.45 : pan, send: 0.15 });
      // a clear pitched attack under the voice so the note is never in doubt
      if (kind === 'spore') AU.kalimba(m + 12, t, 0.35, { bus: 'voice', pan: 0.45 });
      else if (kind === 'risen') AU.glock(m + 12, t, 0.22, { bus: 'voice', pan: 0.45, dec: 0.8 });
      else AU.pluck(m, t, 0.45, { bus: 'voice', bright: 0.6, pan: 0.45 });
    });
  },
  // a phrase in bells: echoes, and the boss when it sings at you
  bells(notes, stepBeats, vel) {
    if (!AU.on) return;
    const t0 = AU.ctx.currentTime + 0.03, base = this.callBase(), mode = this.scene.mode;
    AU.duckMusic(t0, notes.length * stepBeats * this.spb() + 0.2, 0.5);
    notes.forEach((d, j) => AU.glock(base + dOff(mode, d) + 12, t0 + j * stepBeats * this.spb(), vel || 0.5, { bus: 'voice', dec: 1.3, send: 0.2 }));
  },
  bossSing(notes, noteBeats, kind) {
    if (!AU.on) return;
    const t0 = AU.ctx.currentTime + 0.03, base = this.callBase(), mode = this.scene.mode, d = noteBeats * this.spb();
    notes.forEach((deg, j) => {
      const m = base + dOff(mode, deg);
      AU.voice(m, t0 + j * d, d * 0.9, 1, { kind, send: 0.3 });
      if (kind !== 'fork') AU.voice(m - 12, t0 + j * d, d * 0.9, 0.5, { kind, send: 0.3 });
      else AU.glock(m + 12, t0 + j * d, 0.25, { bus: 'voice', dec: 1.5 });
    });
  },
  // your own unit sings its motif as it arrives
  summon(motif, key) {
    if (!AU.on) return;
    const t0 = AU.ctx.currentTime + 0.02, base = this.callBase() + (key === 'hvy' ? -12 : key === 'rng' ? 12 : 0), mode = this.scene.mode;
    motif.forEach((d, j) => {
      const t = t0 + j * 0.085, m = base + dOff(mode, d);
      AU.pluck(m, t, 0.5, { bus: 'sfx', bright: 0.6, pan: -0.4 });
      if (j === motif.length - 1) { AU.voice(m, t, 0.5, 0.5, { kind: 'choir', bus: 'sfx', pan: -0.4 }); AU.glock(m + 12, t, 0.3, { bus: 'sfx', pan: -0.4 }); }
    });
  },
  capture(motif) {
    if (!AU.on) return;
    const t0 = AU.ctx.currentTime + 0.02, base = this.callBase(), mode = this.scene.mode;
    motif.forEach((d, j) => AU.voice(base + dOff(mode, d), t0 + j * 0.1, 0.35, 0.55, { kind: 'choir', bus: 'sfx', pan: 0.2 }));
    for (let k = 0; k < 8; k++) AU.pluck(base + 12 + dOff(mode, 1 + k), t0 + 0.1 * motif.length + k * 0.045, 0.3, { bus: 'sfx', bright: 0.8, pan: 0.2 - k * 0.05, send: 0.3 });
    AU.glock(base + 24, t0 + 0.1 * motif.length + 0.36, 0.4, { bus: 'sfx', dec: 1.8 });
  },
  etudeDone(streak, echo) {
    if (!AU.on) return;
    const t0 = AU.ctx.currentTime + 0.01, b = this.callBase() + 12, mode = this.scene.mode;
    [1, 5, 8].concat(echo ? [10, 12] : []).forEach((d, j) => AU.glock(b + dOff(mode, d), t0 + j * 0.055, 0.28, { bus: 'sfx', dec: 0.9, pan: -0.2 + j * 0.15 }));
    if (streak && streak % 5 === 0) for (let k = 0; k < 6; k++) AU.glock(b + 12 + dOff(mode, 1 + k * 2), t0 + 0.2 + k * 0.05, 0.2, { bus: 'sfx', dec: 0.8 });
  },
  bless(kind) { // an upgrade lands: bright for Edge, warm for Heart, low and wide for Mail
    if (!AU.on) return;
    const t0 = AU.ctx.currentTime + 0.02, b = this.callBase(), mode = this.scene.mode;
    if (kind === 'edge') { [1, 5, 8, 12].forEach((d, j) => AU.pluck(b + 12 + dOff(mode, d), t0 + j * 0.05, 0.6, { bus: 'sfx', bright: 0.95, pan: -0.3 + j * 0.2 })); AU.drum('shatter', t0 + 0.2, 0.25, { bus: 'sfx', pitch: 1.6 }); AU.glock(b + 24 + dOff(mode, 5), t0 + 0.2, 0.35, { bus: 'sfx' }); }
    else if (kind === 'heart') { [1, 3, 5].forEach((d, j) => AU.voice(b + dOff(mode, d), t0 + j * 0.07, 1.1, 0.5, { kind: 'choir', bus: 'sfx', pan: (j - 1) * 0.35, send: 0.4 })); AU.glock(b + 12 + dOff(mode, 8), t0 + 0.25, 0.3, { bus: 'sfx', dec: 1.6 }); }
    else { [1, 5, 8].forEach((d, j) => AU.organ(b - 12 + dOff(mode, d), t0 + j * 0.04, 0.8, 0.7, { bus: 'sfx', pan: (j - 1) * 0.3 })); AU.gong(b - 12, t0, 0.22); AU.drum('thud', t0, 0.4, { bus: 'sfx' }); }
  },
  keyChange() {
    if (!AU.on) return;
    const t0 = AU.ctx.currentTime + 0.05, b = this.callBase(), mode = this.scene.mode;
    for (let k = 0; k < 15; k++) AU.pluck(b - 12 + dOff(mode, 1 + k), t0 + k * 0.05, 0.42, { bus: 'sfx', bright: 0.75, pan: -0.5 + k * 0.07, send: 0.3 });
    AU.gong(b, t0 + 0.75, 0.3);
    AU.voice(b, t0 + 0.75, 1.6, 0.6, { kind: 'choir', bus: 'sfx' }); AU.voice(b + 12, t0 + 0.75, 1.6, 0.3, { kind: 'choir', bus: 'sfx' });
  },
  anthem() {
    if (!AU.on) return;
    const t0 = AU.ctx.currentTime + 0.02, b = this.callBase(), mode = this.scene.mode;
    AU.swell(t0, 0.6, 0.35, 5000);
    [1, 3, 5, 8].forEach((d, j) => AU.voice(b + dOff(mode, d), t0 + j * 0.05, 1.8, 0.6, { kind: 'choir', bus: 'sfx', pan: (j - 1.5) * 0.3, send: 0.4 }));
    AU.drum('thud', t0 + 0.55, 0.8, { bus: 'sfx' }); AU.gong(b + 12, t0 + 0.6, 0.25);
    for (let k = 0; k < 8; k++) AU.glock(b + 24 + dOff(mode, 1 + k), t0 + 0.6 + k * 0.04, 0.2, { bus: 'sfx' });
  },
  wardBreak() {
    if (!AU.on) return;
    const t0 = AU.ctx.currentTime + 0.01, b = this.callBase();
    AU.drum('thud', t0, 1, { bus: 'sfx', send: 0.3 }); AU.drum('shatter', t0, 0.9, { bus: 'sfx' }); AU.gong(b - 12, t0, 0.5);
    for (let k = 0; k < 9; k++) AU.bell(84 + Math.random() * 20, t0 + 0.03 + Math.random() * 0.4, 0.14, { bus: 'sfx', dec: 0.3, ratio: 5.1, pan: Math.random() - 0.2 });
  },
  shatter(x) { // a unit breaks
    if (!AU.on) return;
    const t0 = AU.ctx.currentTime;
    AU.drum('shatter', t0, 0.28, { bus: 'sfx', pan: x, pitch: 1.2 });
    for (let k = 0; k < 3; k++) AU.bell(88 + Math.random() * 16, t0 + Math.random() * 0.1, 0.07, { bus: 'sfx', dec: 0.2, ratio: 5.1, pan: x });
  },
  hit(x, ranged) {
    if (!AU.on) return;
    const now = AU.ctx.currentTime;
    if (now - (this._lastHit || 0) < 0.07) return;
    this._lastHit = now;
    AU.drum(ranged ? 'tick' : 'tap', now, ranged ? 0.1 : 0.16, { bus: 'sfx', pan: x, pitch: 0.7 + Math.random() * 0.5 });
  },
  waveWarn() { // a low roll: they are coming
    if (!AU.on) return;
    const t0 = AU.ctx.currentTime, q = this.spb() / 2;
    for (let k = 0; k < 6; k++) AU.drum('boom', t0 + k * q * 0.9, 0.25 + k * 0.08, { bus: 'sfx', pan: 0.5, pitch: 0.8 });
  },
  loftHit() { if (AU.on) { const t = AU.ctx.currentTime; if (t - (this._lh || 0) > 0.25) { this._lh = t; AU.drum('thud', t, 0.5, { bus: 'sfx', pan: -0.6, pitch: 1.3 }); } } },
  fizzle() { if (AU.on) { const t = AU.ctx.currentTime; AU.drum('tick', t, 0.3, { bus: 'sfx', pitch: 0.35 }); AU.drum('tick', t + 0.09, 0.25, { bus: 'sfx', pitch: 0.3 }); } },
  miss() { if (AU.on) AU.drum('boom', AU.ctx.currentTime, 0.3, { bus: 'sfx', pitch: 1.6 }); },
  tick(vel) { if (AU.on) AU.drum('tick', AU.ctx.currentTime, vel || 0.12, { bus: 'sfx', pitch: 1.2 }); },
  click() { if (AU.on) AU.drum('tick', AU.ctx.currentTime, 0.22, { bus: 'sfx', pitch: 0.8 }); },
  duelHit(d) { if (AU.on) AU.glock(this.callBase() + 12 + dOff(this.scene.mode, d), AU.ctx.currentTime, 0.4, { bus: 'sfx' }); },
  duelMiss() { if (AU.on) { const t = AU.ctx.currentTime, b = this.callBase() - 12; AU.voice(b, t, 0.35, 0.5, { kind: 'risen', bus: 'sfx' }); AU.voice(b + 1, t, 0.35, 0.5, { kind: 'risen', bus: 'sfx' }); AU.drum('thud', t, 0.5, { bus: 'sfx' }); } },
  win() {
    if (!AU.on) return;
    const t0 = AU.ctx.currentTime + 0.3, b = this.callBase(), mode = this.scene.mode, q = 0.19;

// one unit, with shadow, health, halo and whatever state it is in
function drawUnit(c, u, v, sx, sy, S, t, nation, bl) {
  const enemyArt = u.home < 0, turned = enemyArt && u.side > 0;
  const fn = enemyArt ? ART[nation + '_' + u.type] : ART[u.type];
  const pal = turned ? UPAL.turned : enemyArt ? UPAL[nation] : UPAL.choir;
  const big = (u.type === 'brute' ? 1.22 : u.type === 'hvy' ? 1.12 : 1) * (1 + 0.2 * (u.rank - 1)) * (1 + 0.05 * (u.tier - 1)) * (1 + 0.06 * u.fort);
  const sc = S * big * (u.row ? 1.04 : 0.94);
  c.save(); c.translate(sx, sy);
  c.fillStyle = 'rgba(6,5,12,0.32)'; c.beginPath(); c.ellipse(0, 1, 12 * sc, 3.4 * sc, 0, 0, TAU); c.fill();
  if (bl && u.side > 0) { // upgrades show as arcs of a ring underfoot: rose for Edge, green for Heart, gold for Mail
    const cols = [['edge', '#e2577c'], ['heart', '#46b98c'], ['mail', '#f2c14e']];
    for (let i = 0; i < 3; i++) {
      const lv = bl[cols[i][0]];
      if (!lv) continue;
      c.strokeStyle = cols[i][1]; c.lineWidth = 1.2 + 0.7 * lv;
      c.beginPath(); c.ellipse(0, 1, 15 * sc, 4.6 * sc, 0, (i * TAU) / 3 + 0.12, ((i + 1) * TAU) / 3 - 0.12); c.stroke();
    }
  }
  if (v.bl > 0) { c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = rgba(v.blCol || '#fff3c4', 0.5 * v.bl); c.beginPath(); c.ellipse(0, -18 * sc, 16 * sc, 24 * sc, 0, 0, TAU); c.fill(); c.restore(); }
  if (v.spawn < 1) { c.globalAlpha = v.spawn; c.translate(0, (1 - v.spawn) * -14); }
  if (u.fort) for (let k = 0; k < u.fort; k++) { c.strokeStyle = rgba('#fff3c4', 0.75); c.lineWidth = 1.4; c.beginPath(); c.ellipse(0, -(46 + k * 5) * sc, (9 - k) * sc, 2.6 * sc, 0, 0, TAU); c.stroke(); }
  c.save();
  c.scale(u.side > 0 ? sc : -sc, sc);
  if (u.state === 'stun') c.rotate(Math.sin(t * 20 + u.id) * 0.05);
  fn(c, pal, { w: v.walk, atk: v.atk, sing: v.sing > 0, t, seed: u.id * 1.7, tier: u.tier });
  c.restore();
  if (turned) { c.strokeStyle = rgba('#fff3c4', 0.9); c.lineWidth = 1.6; c.beginPath(); c.ellipse(0, -44 * sc * (u.type === 'grunt' && nation === 'spore' ? 0.66 : 1), 7 * sc, 2.2 * sc, 0, 0, TAU); c.stroke(); }
  if (v.flash > 0) { c.globalCompositeOperation = 'lighter'; c.fillStyle = `rgba(255,255,255,${0.42 * v.flash})`; c.beginPath(); c.ellipse(0, -18 * sc, 13 * sc, 20 * sc, 0, 0, TAU); c.fill(); c.globalCompositeOperation = 'source-over'; }
  // rank pips for their elites, tier pips for yours
  const pips = enemyArt && !turned ? u.rank - 1 : !enemyArt ? u.tier - 1 : 0;
  for (let k = 0; k < pips; k++) { const px = (k - (pips - 1) / 2) * 6 * sc, py = -(52 + (u.type === 'hvy' || u.type === 'brute' ? 6 : 0)) * sc; gPoly(c, [px, py - 3.4, px + 2.6, py, px, py + 3.4, px - 2.6, py], enemyArt ? '#e2577c' : '#f2c14e', 1); }
  if (u.hp < u.max * 0.995) {
    const bw = 22 * sc, by = 5 * sc;
    c.fillStyle = 'rgba(6,5,12,0.75)'; c.fillRect(-bw / 2 - 1, by - 1, bw + 2, 5);
    c.fillStyle = u.side > 0 ? '#7fe0a0' : '#ef6a6a'; c.fillRect(-bw / 2, by, bw * clamp(u.hp / u.max, 0, 1), 3);
  }
  c.restore();
}

  hudInit(B) {

  callLabels(B, motif, prog) { // what you are allowed to see of their motif
    const ear = Save.s.ear;

      if (ear === 0 || j < prog) return degLabel(B, d);

  hudUpdate(B, now) {
    const H = this.hud, P = B.perf, s = Save.s;
    this.set('h-mana', String(Math.floor(B.mana)));
    this.set('h-flow', String(flowOf(B)));
    this.set('h-bpm', String(B.bpm));
    const bm = Math.round((incMult(B) - 1) * 100);
    this.set('h-bonus', bm > 0 ? '+' + bm + '%' : bm < 0 ? '−' + -bm + '%' : '');
    const sl = $('i-bpm'); if (document.activeElement !== sl && +sl.value !== B.bpm) sl.value = B.bpm;
    const an = Math.round(clamp(B.anthem, 0, 100)); if (H.last.an !== an) { H.last.an = an; $('h-anthem').style.width = an + '%'; }
    // upgrades, streak, speed
    for (const k in H.bl) {
      const lv = B.bless[k];
      if (H.last['bl' + k] === lv) continue;
      const b = H.bl[k], up = lv > (H.last['bl' + k] || 0);
      H.last['bl' + k] = lv;
      this.cls(b.node, 'on', lv > 0);
      b.pips.forEach((p, j) => this.cls(p, 'on', j < lv));
      if (up) { b.node.classList.remove('pop'); void b.node.offsetWidth; b.node.classList.add('pop'); }
    }
    let focus = null;
    for (const c of B.clouds) if (c.idx > 0 && (!focus || c.idx > focus.idx)) focus = c;
    const sub = focus && focus.idx > 1 ? P.sub : 0;
    this.set('rb-speed', sub >= 3.5 ? 'sixteenths' : sub >= 2.5 ? 'triplets' : sub >= 1.5 ? 'eighths' : sub > 0 ? 'quarters' : (B.cfg.grade ? '' : 'grade ' + GRADE_NAMES[cloudGrade(B)]));
    this.set('rb-streak', B.streak > 1 ? 'streak ×' + B.streak : '');
    // what each cloud says, in this player's notation
    const clouds = [];
    for (const c of B.clouds) {
      const key = c.id + ':' + s.labels + B.tonicPc + ':' + (c.hidden ? c.idx : '');
      let L = H.lab[c.id];
      if (!L || L.key !== key) {
        const labels = c.notes.map((d, j) => (c.hidden && j >= c.idx ? '?' : degLabel(B, d)));
        L = H.lab[c.id] = { key, c, labels, wide: Math.max(...labels.map((t) => t.length)) * (s.labels === 'sung' ? 6.4 : 7) };
      }
      clouds.push(L);
    }
    if (B.clouds.length === 0 && Object.keys(H.lab).length) H.lab = {};
    // motif cards
    const full = popOf(B) >= POP_CAP;
    let armed = false;
    for (const k in H.cards) {
      const c = H.cards[k], labKey = s.labels + B.tonicPc;
      if (c.lab !== labKey) { c.lab = labKey; c.p = this.pillsFill(c.pills, c.motif.map((d) => degLabel(B, d))); c.prog = -1; }
      const prog = motifProgress(B, c.motif);
      if (prog !== c.prog) { c.prog = prog; c.p.forEach((p, j) => this.cls(p, 'done', j < prog)); }
      this.cls(c.node, 'poor', B.mana < unitCost(k));
      const arm = prog === c.motif.length; if (arm) armed = true;
      this.cls(c.node, 'armed', arm);
      const st = full ? 'choir full: this fortifies' : c.base; if (c.subT !== st) { c.subT = st; c.sub.textContent = st; }
    }
    // their call
    const L = H.listen, open = callOpen(B);
    this.cls(L.node, 'off', !open);
    let callProg = 0, callLab = null, callCost = 0;
    if (open) {
      const u = B.units.find((x) => x.id === B.call.id), foe = B.lv.nation === 'choir' ? 'wild' : B.lv.nation;
      callProg = motifProgress(B, B.call.motif); callCost = captureCost(B, B.call.type, u ? u.rank : 1);
      callLab = this.callLabels(B, B.call.motif, callProg);
      const key = B.call.id + ':' + B.callIx + ':' + callProg + ':' + s.ear + s.labels;
      if (H.callId !== key) {
        H.callId = key;
        L.name.textContent = NATIONS[foe].units[B.call.type] + (u && u.rank > 1 ? ' ' + TIER_NAMES[u.rank] : '') + ' sings';
        L.cost.textContent = '◆' + callCost;
        const ps = this.pillsFill(L.pills, callLab); ps.forEach((p, j) => this.cls(p, 'done', j < callProg));
      }
      this.cls(L.node, 'poor', B.mana < callCost);
      if (callProg === B.call.motif.length) armed = true;
    }
    // harmony
    if (B.lv.kind !== 'finale' && !B.cfg.rehearsal) {
      const cf = clashFactor(B), key = B.eDrone + ':' + P.drone + ':' + B.tonicPc + s.labels;
      if (H.last.harm !== key) {
        H.last.harm = key;
        const v = !P.drone ? '<span>hold a note against it</span>' : cf < 1 ? '<b class="clash">Clash: they earn ' + Math.round(cf * 100) + '%</b>' : cf > 1 ? '<b class="feed">Unison: you are feeding them</b>' : '<b>Blend: no effect</b>';
        $('harm').innerHTML = '<span class="label">Their drone</span><b>' + esc(degLabel(B, B.eDrone)) + (P.drone ? ' · yours ' + esc(degLabel(B, P.drone)) : '') + '</b>' + v;
      }
    } else if (B.cfg.rehearsal && H.last.harm !== 'reh') { H.last.harm = 'reh'; $('harm').innerHTML = '<span class="label">Rehearsal</span><b>No enemy</b><span>drones and clouds, at your own pace</span>'; }
    // duel panel
    const D = B.duel, dn = $('duel');
    if (dn.hidden === !!D) dn.hidden = !D;
    if (D) {
      const foe = B.lv.nation, boss = NATIONS[foe].boss, shown = s.ear === 0;
      const key = D.round + D.phase + D.idx + ':' + D.sung + ':' + D.strikes;

          if (D.phase === 'answer' || D.phase === 'done') return j < D.idx || D.phase === 'done' ? degLabel(B, d) : shown ? degLabel(B, d) : s.ear === 1 && j > 0 ? (D.notes[j] > D.notes[j - 1] ? '↑' : '↓') : s.ear === 1 ? '•' : '?';

    const next = [];

      else for (const c of B.clouds) if (!c.hidden) next.push({ d: c.notes[0], col: KIND[c.kind].accent, dim: true });

      next, clouds, focus, call: open, callLabels: callLab, callProg, callCost, live: Input.live, padL: App.gutL,
      hold: c ? (c.held ? 1 : clamp((now - c.ms) / holdMsFor(B.bpm), 0, 0.999)) : 0, holdArmed: armed,
      rungLabel: (r) => degLabel(B, r.d, s.labels === 'deg' ? 'deg' : s.labels),
      rungSub: (r) => (B.mode.steps.length === 7 ? degLabel(B, r.d, s.labels === 'deg' ? 'name' : 'deg') : ''),

  },

  // ---------- results ----------
  results(B, info) {

    root.append(el('span', 'label', lv.name + ' · ' + B.mode.name));
    root.append(el('h2', '', B.cfg.rehearsal ? 'Rehearsal over' : won ? (lv.kind === 'finale' ? 'The Fork rings' : 'The last ward is down') : 'The Loft fell'));

    root.append(el('div', 'bigflow', String(flowOf(B))));
    const pace = paceOf(B), nextPar = won && lv.kind !== 'finale' && info.stars < 3 ? B.num.par[info.stars - 1] : 0;
    const cap = el('p', 'fine', 'Flow: every drop of mana you made, plus every drop you spent.' + (lv.kind !== 'finale' ? ' Pace: ' + pace + ' a minute.' + (nextPar ? ' The next star is at ' + nextPar + '. Tempo gets you there.' : '') : ''));
    cap.style.textAlign = 'center'; cap.style.alignSelf = 'center'; root.append(cap);
    const g = el('div', 'stats');

    add(Math.round(st.bpmSum / Math.max(1, st.beats)) + ' / ' + Math.round(st.bpmPeak), 'tempo, average / peak');
    add(st.notes ? Math.round((100 * (st.notes - st.sour)) / st.notes) + '%' : '–', 'notes inside the mode');

      add(String(st.blessings), 'upgrade tunes');

      add(String(st.captures), 'voices turned');
      add(st.centsN > 1 ? '±' + Math.round(st.centsSum / st.centsN) + '¢' : '–', 'drone tuning, average');
      add(String(st.anthems), 'anthems');
      add(String(st.bestStreak), 'longest clean streak');
    } else { add(String(st.duelNotes), 'fifths answered'); add(String(st.strikes || 0), 'wrong turns'); }
    root.append(g);
    if (info.unlock) { const u = el('div', 'unlock'); u.append(el('b', '', info.unlock.t), el('div', '', info.unlock.d)); root.append(u); }
    if (!won && !B.cfg.rehearsal) root.append(el('p', 'fine', lv.i > 6 ? 'Drones alone will not hold this one. Answer their calls, play the clouds for upgrades, or set the opposition to Gentle.' : 'Hold a drone for mana, and summon as soon as you can afford to. An empty lane loses.'));
    else if (won && lv.kind !== 'finale') { const least = METHODS.slice().sort((a, b) => st.methods[a[0]] - st.methods[b[0]])[0]; if (st.etudes >= 3 && st.methods[least[0]] === 0) root.append(el('p', 'fine', 'You played no ' + least[1] + ' this time. The clouds will offer more of them.')); }
    const r = el('div', 'mrow');
    const b1 = el('button', 'btn ghost', 'Again'); b1.type = 'button'; b1.id = 'b-again'; b1.addEventListener('click', () => App.enterLevel(lv.i, !!B.cfg.rehearsal, true));

    r.append(b1, b2); root.append(r);
  },
};

// ===== main: screens, the frame loop, and the wiring between the battle and everything you see and hear =====
const TUT_RULES = {
  drone: { done: (B) => B.stats.droneBeats >= 3 },
  summon: { done: (B) => B.stats.summons >= 1 },
  capture: { when: (B) => !!B.call, done: (B, T) => B.stats.captures >= 1 || T.t > 40 },
  cloud: { done: (B, T) => B.stats.etudes >= 1 || T.t > 44 },
  bless: { when: (B) => B.clouds.some((c) => c.kind !== 'rain'), done: (B, T) => B.stats.blessings >= 1 || T.t > 40 },
  tempo: { done: (B, T) => B.bpm !== B.baseBpm || T.t > 20 },
  key: { when: (B) => B.verse >= 1, done: (B, T) => T.t > 16 },
  harmony: { when: (B) => B.beat > 14, done: (B, T) => T.t > 30 },
  echo: { when: (B) => B.clouds.some((c) => c.hidden), done: (B, T) => T.t > 24 || B.stats.echoes > 0 },
};
const storyNation = (key) => { if (key === 'intro') return 'choir'; const lv = LEVEL_BY_ID[key.split(':')[1]]; return lv ? lv.nation : 'choir'; };

const App = {
  screen: 'title', B: null, paused: false, sel: 0, map: null, gutL: 16, calib: null, calibNote: null, story: null, tut: null, last: 0, endT: 0, onModalClose: null,

  boot() {

    this.applyInput();
    this.bind();
    this.measure();
    $('b-begin').textContent = Save.s.setup ? 'Continue' : 'Begin';
    Music.set({ kind: 'title', nation: 'choir', mode: MODES.lydian, tonicPc: 5, bpm: 66 }, true);
    this.last = performance.now();
    const loop = (ts) => { this.frame(ts); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  },
  applyInput() {

    Input.onOn = (midi, cents, src) => {
      const now = performance.now();

      if (this.calib) this.calibNote = { midi, t: now };
      if (this.screen === 'battle' && this.B && !this.paused) noteOn(this.B, midi, cents, now);
    };
    Input.scaleTest = (n) => this.screen !== 'battle' || !this.B || ladderMap(this.B.lad, n).deg > 0;
    Input.onOff = (src) => {
      if (src !== 'mic') Music.monitor(null);
      this.calibNote = null;
      if (this.screen === 'battle' && this.B) noteOff(this.B);
    };
  },
  async wake() { // first tap: sound may start, and the saved input can be asked for
    if (AU.init()) { await AU.resume(); AU.setVol({ music: Save.s.music, voice: Save.s.voice, sfx: Save.s.sfx }); Music.ensure(); Music.applySus(); }
  },
  async restoreInput() {
    const s = Save.s;
    if (s.input === 'mic' && !Input.micReady) { if (await Input.startMic(s.speakers)) { Input.mode = 'mic'; this.applyInput(); } else { UI.toast('No microphone on this page, so tap the ladder or use the keys. The downloaded game file can listen.', 5200); } }
    else if (s.input === 'midi' && !Input.midiReady) { if (await Input.startMidi()) Input.mode = 'midi'; }
    else Input.mode = s.input;
  },
  measure() {
    const cv = $('cv').getBoundingClientRect(), st = $('stage').getBoundingClientRect();
    if (st.width > 10) GFX.view = { x: st.left - cv.left, y: st.top - cv.top, w: st.width, h: st.height };
    this.gutL = parseFloat(getComputedStyle(document.querySelector('.hud-top')).paddingLeft) || 16;
    const g = GFX.geom(GFX.view);
    $('stage').style.setProperty('--clear', Math.round(this.gutL + g.lw + 30) + 'px');
    if (this.B) { // how many clouds the sky has room for
      const n = GFX.cloudBerths(GFX.view, GFX.geom(GFX.view), this.gutL).length;
      this.B.cfg.berths = n; this.B.clouds = this.B.clouds.filter((c) => c.slot < n);
    }
    if (this.screen === 'map') this.layoutMap();
  },
  bind() {
    const on = (id, ev, fn) => $(id).addEventListener(ev, fn);
    document.addEventListener('pointerdown', () => this.wake(), { once: true });
    document.addEventListener('keydown', () => this.wake(), { once: true });
    on('b-begin', 'click', async () => {
      await this.wake(); Music.click();

    });
    on('b-how', 'click', () => UI.modal((r) => UI.help(r)));
    on('b-set0', 'click', () => UI.modal((r) => UI.settings(r, false)));
    on('b-set1', 'click', () => UI.modal((r) => UI.settings(r, false)));
    on('b-journal', 'click', () => UI.modal((r) => UI.journal(r)));
    on('b-pause', 'click', () => this.pause());
    on('b-next', 'click', () => this.storyNext());
    on('b-skip', 'click', () => this.storyEnd());

    on('b-leave', 'click', () => this.finish());
    on('i-bpm', 'input', () => { if (this.B) setBpm(this.B, +$('i-bpm').value); });
    on('b-slower', 'click', () => { if (this.B) setBpm(this.B, this.B.bpm - 4); });
    on('b-faster', 'click', () => { if (this.B) setBpm(this.B, this.B.bpm + 4); });
    on('i-accel', 'change', () => { Save.s.accel = $('i-accel').checked; if (this.B) this.B.cfg.accel = Save.s.accel; persist(); });
    $('modal').addEventListener('click', (e) => { if (e.target === $('modal') || e.target.classList.contains('sheet-wrap')) UI.closeModal(); });
    window.addEventListener('resize', () => { GFX.resize(); this.measure(); });
    // the stage changes height when the panels around it do (a card appears, a line wraps), and the canvas must follow
    if (window.ResizeObserver) new ResizeObserver(() => this.measure()).observe($('stage'));
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.pause(); else if (this.screen === 'battle') this.awake(true); });
    // the ladder under a finger
    const stage = $('stage');

    const at = (e) => { const r = $('cv').getBoundingClientRect(); return GFX.ladderHit(e.clientX - r.left, e.clientY - r.top); };
    stage.addEventListener('pointerdown', (e) => {
      const m = at(e);
      if (m == null) return;
      e.preventDefault(); ptr = e.pointerId; ptrMidi = m;

    stage.addEventListener('pointermove', (e) => {
      if (e.pointerId !== ptr) return;
      const m = at(e);
      if (m != null && m !== ptrMidi) { const old = ptrMidi; ptrMidi = m; Input.press(m, 'touch'); Input.release(old, 'touch'); }
    });
    const up = (e) => { if (e.pointerId !== ptr) return; ptr = null; if (ptrMidi != null) Input.release(ptrMidi, 'touch'); ptrMidi = null; };
    stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
    // keys: 1..0 are rungs 1 to 10, Q..I are rungs 8 to 15
    const keyRung = (e) => {
      const k = e.key.toLowerCase(), B = this.B;
      if (!B || this.screen !== 'battle') return null;
      const twelve = B.mode.steps.length === 12;
      let d = '1234567890'.indexOf(k) + 1;
      if (!d && twelve) d = k === '-' ? 11 : k === '=' ? 12 : 0;
      if (!d && !twelve) { const q = 'qwertyui'.indexOf(k); if (q >= 0) d = 8 + q; }
      if (!d || d > B.lad.rungs.length || (!twelve && d > B.top)) return null;
      return B.lad.rungs[d - 1].midi;
    };
    const down = {};
    window.addEventListener('keydown', (e) => {
      if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
      if (e.key === 'Escape') { if (!$('modal').hidden) UI.closeModal(); else this.pause(); return; }
      if (this.screen === 'story' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); this.storyNext(); return; }
      if (this.screen !== 'battle' || !this.B || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); setBpm(this.B, this.B.bpm + 2); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); setBpm(this.B, this.B.bpm - 2); return; }
      if (e.repeat) return;
      const m = keyRung(e);
      if (m != null) { e.preventDefault(); down[e.code] = m; Input.press(m, 'key'); }
    });
    window.addEventListener('keyup', (e) => { const m = down[e.code]; if (m != null) { delete down[e.code]; Input.release(m, 'key'); } });
    window.addEventListener('blur', () => { for (const k in down) delete down[k]; Input.releaseAll('key'); });
  },

  // ---------- flow between screens ----------
  async afterSetup() {

  storyPage() {

    const keep = { input: Save.s.input, inst: Save.s.inst, vrange: Save.s.vrange, lo: Save.s.lo, hi: Save.s.hi, music: Save.s.music, voice: Save.s.voice, sfx: Save.s.sfx, speakers: Save.s.speakers };

  // keep the screen on while you play: hands on a horn do not touch the glass
  awake(on) {

  },
  toMap() {
    this.awake(false);
    UI.show('s-map'); this.screen = 'map';

  },
  buildMapNodes() {
    const box = $('map-nodes');

    LEVELS.forEach((lv, i) => {
      const b = el('button'); b.type = 'button'; b.dataset.i = i; b.setAttribute('aria-label', lv.name + ', ' + MODES[lv.mode].name);

  layoutMap() {

    if (area.width < 10) return;

  },
  // which keys the next run of a level uses: first the written ones, then whatever you have not sung yet
  keysFor(lv) {
    const rec = Save.levels[lv.id], have = rec && rec.keys ? rec.keys : [];
    if (!have.length || lv.kind === 'finale') return lv.keys.slice();
    const offs = lv.keys.map((k) => mod(k - lv.keys[0], 12));

  async enterLevel(i, rehearsal, skipStory) {

  startBattle(i, rehearsal) {

    const keys = rehearsal ? Array.from({ length: 12 }, (_, j) => mod(k0[0] + j * 5, 12)) : k0;
    const B = createBattle({ level: lv, vl: Math.max(Save.vl, i), keys, bpm: lv.bpm, bonus: bonusOf(s), foe: FOE_MULT[s.foe], strict: s.strict, earMode: s.ear, grade: s.grade, skill: s.skill || 1, cover: Save.journal.cover[lv.mode], echo: s.echo, accel: s.accel, range: { lo: s.lo, hi: s.hi }, seed: ((Date.now() & 0xffff) + i * 131) | 1, rehearsal: !!rehearsal });
    if (rehearsal) B.state = 'fight';
    this.B = B; this.paused = false; this.endT = 0;
    this.awake(true);
    GFX.uv = {}; GFX.cl = {}; GFX.parts = []; GFX.shots = []; GFX.anthemT = 0; GFX.loftFlash = 0; GFX.bossSing = 0;
    UI.show('s-battle'); this.screen = 'battle';
    UI.hudInit(B);
    this.measure();
    Music.set({ kind: lv.kind === 'finale' ? 'duel' : 'battle', nation: lv.nation, mode: B.mode, tonicPc: B.tonicPc, bpm: B.bpm, ladTonic: B.lad.tonic, eDrone: rehearsal || lv.kind === 'finale' ? 0 : B.eDrone, ref: s.ref, intensity: 0.4 }, true);
    Music.keyChange();
    const k = keyLine(lv, B.tonicPc);
    GFX.say(lv.kind === 'finale' ? 'ALL TWELVE' : (k.key + ' ' + B.mode.name).toUpperCase(), lv.kind === 'finale' ? 'Listen, then sing them back.' : B.mode.formula, NATION_HEX[lv.nation], 3.6);
    this.tut = TUTORIAL[lv.id] && !Save.seen['tut:' + lv.id] && !rehearsal ? { list: TUTORIAL[lv.id], i: 0, t: 0, shown: false } : null;
    $('tine').hidden = true;
  },
  liveCfg() { // a setting changed in the middle of a battle
    const B = this.B, s = Save.s;
    if (!B) { if (this.screen === 'map') UI.card(this.sel); return; }
    const g = B.cfg.grade;
    Object.assign(B.cfg, { bonus: bonusOf(s), foe: FOE_MULT[s.foe], strict: s.strict, earMode: s.ear, grade: s.grade, echo: s.echo });
    if (g !== s.grade) { B.clouds.length = 0; B.cloudCool = 0; }
    Music.set({ ref: s.ref });
    this.refreshHud();
  },
  refreshHud() { if (this.B && this.screen === 'battle') UI.hudKey(this.B); else if (this.screen === 'map') UI.card(this.sel); },
  pause() {
    if (this.screen !== 'battle' || this.paused || !this.B || this.B.state === 'won' || this.B.state === 'lost') return;
    this.paused = true;
    if (AU.on) AU.master.gain.setTargetAtTime(0.2, AU.ctx.currentTime, 0.05);
    Input.releaseAll('key'); Input.releaseAll('touch');
    this.onModalClose = () => { this.paused = false; this.last = performance.now(); if (AU.on) AU.master.gain.setTargetAtTime(0.9, AU.ctx.currentTime, 0.05); };
    UI.modal((r) => {
      r.append(el('h2', '', 'Paused'));
      const row = el('div', 'row'); row.style.justifyContent = 'flex-start';
      const mk = (label, cls, fn) => { const b = el('button', 'btn ' + cls, label); b.type = 'button'; b.addEventListener('click', fn); row.append(b); };
      mk('Resume', '', () => UI.closeModal());
      mk('Settings', 'ghost', () => UI.settings(r, false));
      mk('How it plays', 'ghost', () => { r.innerHTML = ''; UI.help(r); });
      mk('Start over', 'ghost', () => { const i = this.B.lv.i, reh = !!this.B.cfg.rehearsal; this.onModalClose = null; $('modal').hidden = true; if (AU.on) AU.master.gain.setTargetAtTime(0.9, AU.ctx.currentTime, 0.05); this.startBattle(i, reh); });
      mk('Leave', 'ghost', () => { this.onModalClose = null; $('modal').hidden = true; if (AU.on) AU.master.gain.setTargetAtTime(0.9, AU.ctx.currentTime, 0.05); this.paused = false; this.toMap(); });
      r.append(row);
    });
  },
  finish() {
    const B = this.B;
    if (!B || this.screen !== 'battle') return;
    const lv = B.lv, won = B.state === 'won', reh = !!B.cfg.rehearsal, info = { stars: starsFor(B), unlock: null };
    const j = Save.journal;
    j.notes += B.stats.notes; j.etudes += B.stats.etudes; j.captures += B.stats.captures; j.blessings += B.stats.blessings;
    if (lv.kind !== 'finale') { // what has been covered in this mode steers what the clouds offer next time
      j.cover[lv.mode] = B.cover;
      const m = j.methods[lv.mode] || (j.methods[lv.mode] = { step: 0, leap: 0, chord: 0, ear: 0 });
      for (const k in B.stats.methods) m[k] = (m[k] || 0) + B.stats.methods[k];
      if (!B.cfg.grade) Save.s.skill = B.skill;
    }
    for (const f in B.stats.fam) if (!(j.fam[f] >= B.stats.fam[f])) j.fam[f] = B.stats.fam[f];
    if (!reh) {
      const rec = Save.levels[lv.id] || (Save.levels[lv.id] = { wins: 0, stars: 0, bestFlow: 0, keys: [] });
      for (const k of B.keys.slice(0, won ? B.keys.length : B.eBase.ward)) if (!rec.keys.includes(k)) rec.keys.push(k);
      if (won) {
        rec.wins++; rec.stars = Math.max(rec.stars, info.stars); rec.bestFlow = Math.max(rec.bestFlow, flowOf(B)); rec.bestPace = Math.max(rec.bestPace || 0, paceOf(B));
        if (!Save.done[lv.id]) { Save.done[lv.id] = 1; Save.vl = Math.max(Save.vl, lv.i + 1); info.unlock = UNLOCKS[lv.i + 1] || null; }
      }
    }
    persist();
    Music.monitor(null);
    Music.set({ kind: 'results', eDrone: 0, ref: false });
    UI.results(B, info); UI.show('s-results'); this.screen = 'results';
  },
  afterResults(wonLevel) {
    const key = wonLevel ? 'post:' + wonLevel.id : null;
    if (key && STORY[key] && !Save.seen[key]) this.tell(key, () => this.toMap());
    else this.toMap();
  },

  // ---------- what a battle event looks and sounds like ----------
  onEvent(B, e) {
    const G = GFX.geom(GFX.view), foe = B.lv.nation === 'choir' ? 'wild' : B.lv.nation, lx = G.sx(LANE.p), ex = G.sx(LANE.e);
    const pan = (x) => clamp(((x - LANE.p) / (LANE.e - LANE.p)) * 1.6 - 0.8, -0.8, 0.8);
    const uv = (id) => GFX.uv[id];
    switch (e.t) {
      case 'summon': Music.summon(e.motif, e.key); GFX.ring(lx + 10, G.gy - 20 * G.S, '#f2c14e', 50 * G.S, 0.6); GFX.sparks(lx + 8, G.gy - 22 * G.S, '#fff3c4', 12); break;
      case 'fortify': { const v = uv(e.id); Music.summon(PLAYER_MOTIFS[e.key][B.tiers[e.key] - 1], e.key); if (v && v.sx) { GFX.ring(v.sx, v.sy - 20 * G.S, '#fff3c4', 36 * G.S, 0.6); GFX.text(v.sx, v.sy - 56 * G.S, 'Fortified', '#fff3c4'); } break; }
      case 'fizzle': Music.fizzle(); GFX.text(lx + 40, G.gy - 70 * G.S, e.full ? 'The choir is full' : 'Need ' + e.need + ' mana', '#ef6a6a'); break;
      case 'capture': { const v = uv(e.id); Music.capture(B.lv.motifs[e.type]); if (v && v.sx) { GFX.ring(v.sx, v.sy - 20 * G.S, '#fff3c4', 70 * G.S, 0.8, 4); GFX.sparks(v.sx, v.sy - 24 * G.S, '#f2c14e', 26); GFX.text(v.sx, v.sy - 60 * G.S, 'In tune', '#f2c14e', 16); } break; }
      case 'hit': {
        const a = uv(e.id), tg = uv(e.tid);
        if (a) a.atk = 0.001;
        if (tg) tg.flash = 1;
        const x2 = e.base ? (e.side > 0 ? ex : lx) : tg && tg.sx, y2 = e.base ? G.gy - 30 * G.S : tg && tg.sy - 20 * G.S;
        if (e.ranged && x2) GFX.shots.push({ x1: a && a.sx ? a.sx : G.sx(e.from), y1: (a && a.sy ? a.sy : G.gy) - 26 * G.S, x2, y2, life: 0, col: e.side > 0 ? '#fff3c4' : NATION_HEX[foe] });
        if (e.base && e.side > 0) GFX.sparks(ex - 8, G.gy - 30 * G.S, '#ef6a6a', 3);
        Music.hit(pan(e.x), e.ranged);
        break;
      }
      case 'die': {
        const p = e.home > 0 ? UPAL.choir : e.captured ? UPAL.turned : UPAL[foe], x = G.sx(e.x);
        GFX.burst(x, G.gy - 18 * G.S, [p.a, p.b, p.c, p.d], 14, 0.8); Music.shatter(pan(e.x));
        break;
      }
      case 'loftHit': GFX.loftFlash = 0.35; Music.loftHit(); break;
      case 'call': { const v = uv(e.id); if (v) v.sing = e.motif.length * 0.5 * (60 / B.bpm) + 0.3; Music.call(e.motif, foe, v && v.sx ? clamp((v.sx / GFX.W) * 2 - 1, -0.8, 0.8) : 0.5); break; }
      case 'cloud': if (e.cloud.hidden) Music.bells(e.cloud.notes, 0.5, 0.5); break;
      case 'echoCue': Music.bells(e.cloud.notes, 0.5, 0.5); { const v = GFX.cl[e.cloud.id]; if (v) v.flash = 1; } break;
      case 'cloudHit': if (Input.mode === 'mic') Music.tick(0.1); break;
      case 'cloudDone': {
        Music.etudeDone(e.streak, e.echo);
        const at = GFX.cloudBurst(e.id, e.echo ? 'echo' : e.kind, G);
        if (at) GFX.text(at.x, at.y + 4, '+' + Math.round(e.bonus) + (e.echo ? '  by ear' : ''), '#9fd0ff', 15);
        break;
      }
      case 'bless': {
        Music.bless(e.kind);
        const col = { edge: '#e2577c', heart: '#46b98c', mail: '#f2c14e' }[e.kind];
        for (const id in GFX.uv) { const u = B.units.find((x) => x.id === +id); if (u && u.side > 0) { GFX.uv[id].bl = 1; GFX.uv[id].blCol = col; } }
        GFX.ring(lx + 10, G.gy - 30 * G.S, col, 90 * G.S, 0.8, 4);
        GFX.say(KIND[e.kind].name.toUpperCase() + ' ' + TIER_NAMES[e.level], e.kind === 'edge' ? 'Your choir hits harder.' : e.kind === 'heart' ? 'Your choir is mended, and sturdier.' : 'Your choir takes less from every blow.', col, 2.2);
        break;
      }
      case 'blessReset': GFX.text(lx + 50, G.gy - 96 * G.S, 'The upgrades stay behind with the old key', '#aaa4be', 13); break;
      case 'cloudMiss': Music.miss(); { const r = $('ribbon'); r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake'); } for (const id in GFX.cl) GFX.cl[id].flash = 0.6; break;
      case 'anthem': Music.anthem(); GFX.anthemT = 0.8; GFX.flash = 0.7; GFX.shake = 0.6; GFX.say('ANTHEM', null, '#fff3c4', 1.6); break;
      case 'waveWarn': Music.waveWarn(); GFX.text(ex - 30, G.gy - 120 * G.S, 'They are coming', '#ef6a6a', 14); break;
      case 'wardBreak': Music.wardBreak(); GFX.shake = 1; GFX.flash = 0.5; GFX.burst(ex, G.gy - 100 * G.S, ['#fff3c4', '#58a6e6', '#e2577c', '#46b98c'], 40, 1.4); break;
      case 'key': {
        Music.set({ tonicPc: B.tonicPc, ladTonic: B.lad.tonic }); Music.keyChange(); UI.hudKey(B);
        const k = keyLine(B.lv, B.tonicPc);
        GFX.say((k.key + ' ' + B.mode.name).toUpperCase(), B.cfg.rehearsal ? B.mode.formula : 'The key moves. The numbers do not.', NATION_HEX[B.lv.nation], 3.4);
        break;
      }
      case 'duelStart': Music.set({ kind: 'duel', eDrone: 0 }); break;
      case 'duelSing': Music.bossSing(e.notes, e.noteDur, foe); GFX.bossSing = e.notes.length * e.noteDur * (60 / B.bpm) + 0.3; break;
      case 'duelHit': Music.duelHit(B.duel ? B.duel.notes[e.idx - 1] : 1); break;
      case 'duelMiss': Music.duelMiss(); { const r = $('duel'); r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake'); } break;
      case 'duelWon': Music.etudeDone(5, true); GFX.flash = 0.4; break;
      case 'state': if (e.state === 'fight' && B.lv.kind !== 'finale') Music.set({ kind: 'battle', eDrone: B.cfg.rehearsal ? 0 : B.eDrone }); break;
      case 'win': Music.win(); GFX.flash = 0.8; break;
      case 'lose': Music.lose(); GFX.shake = 1; break;
      default: break;
    }
  },
  tutTick(B, db) {
    const T = this.tut;
    if (!T) return;
    const cur = T.list[T.i], rule = TUT_RULES[cur.id];
    if (!T.shown) {
      if (!rule.when || rule.when(B)) { T.shown = true; T.t = 0; $('tine-text').textContent = cur.text; $('tine').hidden = false; }
    } else {
      T.t += db;
      if (rule.done(B, T)) {
        T.i++; T.shown = false; $('tine').hidden = true;
        if (T.i >= T.list.length) { Save.seen['tut:' + B.lv.id] = 1; persist(); this.tut = null; }
      }
    }
  },

  // ---------- the frame ----------
  frame() {
    const now = performance.now(), dt = Math.min(0.1, Math.max(0, (now - this.last) / 1000));
    this.last = now;
    GFX.t += dt;
    Input.poll(now);
    if (this.calib && this.calibNote && now - this.calibNote.t > 450) {
      const s = Save.s, m = this.calibNote.midi, c = this.calib;
      if (c.which === 'lo') { s.lo = m; if (s.hi < m + 12) s.hi = m + 19; } else { s.hi = m; if (s.lo > m - 12) s.lo = m - 19; }
      this.calib = null; this.calibNote = null; persist(); c.done();
      UI.toast((c.which === 'lo' ? 'Lowest' : 'Highest') + ' note set to ' + midiName(m) + ' (concert).');
    }
    if (!$('modal').hidden || this.screen === 'setup') UI.tunerTick();
    const B = this.B;
    if ((this.screen === 'battle' || this.screen === 'results') && B) {
      const run = this.screen === 'battle' && !this.paused;
      if (run) {
        const db = (dt * B.bpm) / 60;
        if (B.perf.cur && Input.live && !Input.live.exact) B.perf.cur.cents = Input.live.cents;
        stepBattle(B, db, now);
        Music.scene.bpm = B.bpm; Music.scene.intensity = clamp(B.units.length / 9 + (B.rally > 0 ? 0.3 : 0), 0.15, 1);
        if (!B.cfg.rehearsal && B.state === 'fight' && Music.scene.eDrone !== B.eDrone) Music.set({ eDrone: B.eDrone });
        Music.advance(db);
        for (const e of B.ev) this.onEvent(B, e);
        B.ev.length = 0;
        this.tutTick(B, db);
        if (B.state === 'won' || B.state === 'lost') { this.endT += dt; if (this.endT > 2.8) this.finish(); }
      } else if (this.screen === 'results') Music.advance((dt * Music.scene.bpm) / 60);
      const ui = UI.hudUpdate(B, now);
      GFX.drawBattle(B, run ? dt : this.screen === 'results' ? dt * 0.3 : 0, ui);
      return;
    }
    Music.advance((dt * Music.scene.bpm) / 60);
    if (this.screen === 'map' && this.map) GFX.drawMap(dt, this.map, Save, this.sel, instOf().tr);
    else if (this.screen === 'story' && this.story) GFX.drawStory(dt, storyNation(this.story.key), 3);
    else GFX.drawTitle(dt, Save);
  },
};

// test hooks, harmless in play
window.__choir = { App, Save, GFX, AU, Music, Input, LEVELS, MODES, STORY, UI, noteOn, noteOff, stepBattle, midiToFreq,
  sim: { unitCost, captureCost, callOpen, holdMsFor, clashFactor, flowOf, paceOf, starsFor, cloudGrade, PLAYER_MOTIFS, persist } };
const start = () => App.boot();
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();

})();
</script>
</body>
